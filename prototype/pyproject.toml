[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paraeq"
version = "0.1.0"
description = "Open-source headphone measurement and correction EQ"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "platformdirs>=3.0",
    "pyobjc-framework-CoreAudio>=10.0; sys_platform == 'darwin'",
    "scipy>=1.10",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Exact pins for the fixture generator ONLY (tools/generate_fixtures.py asserts
# them at startup). The loose floors above stay for the prototype's own use.
fixtures = [
    "numpy==2.5.0",
    "scipy==1.18.0",
]
gui = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
