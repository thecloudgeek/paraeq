[package]
name = "paraeq-measure"
edition.workspace = true
license.workspace = true
version.workspace = true

# Spec constraint (2026-07-15 measurement-safety-design.md, MS-1): paraeq-dsp
# ONLY among the workspace crates. No Tauri (the policy must stay reachable
# from a future `paraeqd`), no paraeq-coreaudio (the hardware side arrives
# through the `seam` traits, so the level policy stays testable against mocks),
# NO paraeq-engine and no paraeq-decide either -- an engine fact reaches this
# crate only across a declared trait, and `EngineStatusKind`, `TapActivity` and
# `HelperRouting` are MIRROR types declared here rather than imports, so no
# paraeq-engine or paraeq-coreaudio type ever crosses. No unsafe.
#
# The seams, all in `seam.rs` except the two engine ones in `engine_seam.rs`:
# CaptureSource, DeviceFacts, EngineControl, EngineFacts, HelperProcess,
# RenderSink, StimulusHelper, StimulusSink, TapStatus, VolumeControl. Each has
# exactly one production impl, in paraeq-coreaudio or in desktop/src-tauri; the
# mocks in this crate's tests are the other implementors and they are the whole
# reason the seam exists.
#
# The `cargo tree` assertion in CI is the enforcement -- and note that it greps
# for paraeq-engine and paraeq-decide as well as Tauri and CoreAudio, because
# the earlier, narrower grep would have passed a paraeq-engine edge.
# `#![forbid(unsafe_code)]` is the rest.
#
# `hound` arrives with Stage 5's per-position IR store (`store.rs`), which the
# measurement-suite architecture diagram assigns to this crate ("level solve,
# capture orchestration, per-pos IR store"). It is a leaf WAV codec — no
# platform API, no Tauri, no CoreAudio — so MS-1's constraint is untouched;
# `serde` is optional and off by default, for the `StoredWindow` a manifest
# above this crate records.
[dependencies]
hound = { workspace = true }
paraeq-dsp = { path = "../paraeq-dsp" }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
serde = ["dep:serde"]

# paraeq-decide is a DEV-dependency only: `test_level.rs` cross-checks the one
# number both crates tabulate (room `f_start_hz` / `PathProfile.sweep_f_start_hz`)
# so the two tables cannot drift apart silently. It stays out of `cargo tree
# -e normal`, so MS-1's dependency assertion is unaffected.
[dev-dependencies]
paraeq-decide = { path = "../paraeq-decide" }
trybuild = { workspace = true }
