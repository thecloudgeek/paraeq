[package]
name = "paraeq-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `libc`: the verification teardown's SIGTERM rung. `std` has no SIGTERM --
# `Child::kill()` is SIGKILL, which bypasses the helper's `Drop` and leaves its
# private render aggregate wrapping the user's output device. SIGTERM is a
# SECOND ramp request, not a stop, so the child fades rather than clicking.
# Already a workspace dep and already paraeq-coreaudio's, so nothing new enters
# the graph. This is the crate's first (and only) `unsafe`; see verify_seam.rs.
libc = { workspace = true }
log = { workspace = true }
paraeq-coreaudio = { path = "../../crates/paraeq-coreaudio" }
# `paraeq-decide`: this crate lifts a completed verification pass into
# `bundle::Verification` and calls `decide()` on the result. The lift and the
# `CorrectionPlan -> CorrectionConfig::Peq` mapping live here because this is
# the only crate that can see both sides -- paraeq-decide may not depend on
# paraeq-engine, and paraeq-measure may depend on neither.
paraeq-decide = { path = "../../crates/paraeq-decide" }
# `serde`: this crate persists and IPCs `EQBand` (state.rs, profiles.rs,
# settings.rs). The feature is off by default on paraeq-dsp, so every
# consumer with a wire asks for it explicitly -- this one, paraeq-decide,
# and (since R1-6 put `EQBand` inside `CorrectionConfig::Peq`) paraeq-engine.
paraeq-dsp = { path = "../../crates/paraeq-dsp", features = ["serde"] }
paraeq-engine = { path = "../../crates/paraeq-engine" }
# `paraeq-measure` declares the measurement<->engine seam (`EngineFacts`,
# `EngineControl`); this crate is its one production implementor, in
# `verify_seam.rs`. The dependency points INTO the measure crate (which
# depends only on paraeq-dsp), exactly as `paraeq-coreaudio`'s does, so
# MS-1's "no Tauri, no CoreAudio, paraeq-dsp only" still holds over there.
# A transitive path through `paraeq-coreaudio` does not make the crate
# nameable, hence the explicit entry.
paraeq-measure = { path = "../../crates/paraeq-measure" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
