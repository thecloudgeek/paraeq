name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # MS-1 (2026-07-15 measurement-safety-design.md): the level policy stays
      # reachable from a future headless `paraeqd` and testable against mocks
      # only while it depends on neither Tauri nor CoreAudio. The hardware side
      # arrives through the `seam` traits, so this must stay empty.
      - name: paraeq-measure depends on no Tauri and no CoreAudio
        run: |
          if cargo tree -p paraeq-measure -e normal | grep -Eiq 'tauri|core-?audio'; then
            cargo tree -p paraeq-measure -e normal
            echo "::error::paraeq-measure gained a forbidden dependency (MS-1)"
            exit 1
          fi

  frontend:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - run: npx vitest run

  prototype-oracle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -e "./prototype[dev]"
      - run: .venv/bin/pytest prototype/tests -q
