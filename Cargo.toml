[workspace]
members = [
    "crates/paraeq-coreaudio",
    "crates/paraeq-decide",
    "crates/paraeq-dsp",
    "crates/paraeq-engine",
    "crates/paraeq-measure",
    "desktop/src-tauri",
]
exclude = ["spikes/tap-spike"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
approx = "0.5"
arc-swap = "1"
hound = "3.5"
libc = "0.2"
log = "0.4"
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
proptest = "1"
realfft = "3.5"
rtrb = "0.3"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not optional for this workspace. serde_json's default
# float parser is speed-optimized and best-effort to ~15 significant digits, so
# f64 -> JSON -> f64 can land one ULP away. Two things in the design depend on
# that round-trip being exact: the decision engine's idempotence property
# ("overriding a decision to the value auto already chose must produce a
# DecisionSet identical in every field except that decision's source"), which
# is compared across the `fixtures/decide/<case>/{bundle,expected}.json`
# characterization bundles; and profile persistence, where a reloaded profile
# must re-`decide()` to the same plan or `Reanalyze` is not deterministic.
# Measured on this workspace: a 957-point AuthorityCurve round-trips with ULP
# drift in every component vector without this feature, and exactly with it.
# Costs ~2x on float parsing, which is nowhere near any hot path.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
trybuild = "1"
